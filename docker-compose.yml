services:
  db:
    image: postgres:16-alpine
    container_name: chamados-db
    environment:
      POSTGRES_DB: chamados
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - chamados-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chamados"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chamados-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - chamados-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: chamados-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/chamados
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_TICKET_EVENTS_EXCHANGE: ticket.events
      RABBITMQ_NOTIFICATION_QUEUE: ticket.notifications
      JWT_SECRET: docker-dev-secret-change-me
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed:demo && npm start"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: chamados-worker
    environment:
      NODE_ENV: production
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_TICKET_EVENTS_EXCHANGE: ticket.events
      RABBITMQ_NOTIFICATION_QUEUE: ticket.notifications
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: npm run worker:notifications
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    container_name: chamados-frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  chamados-postgres-data:
  chamados-rabbitmq-data:
